[package]
name = "EveryFile"
version = "1.0.0"
description = "EveryFile desktop application"
authors = ["Lebi_Cybereun <cybereunny@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "everyfile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "=2.7.2"
ignore = "=0.4.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39.0", features = ["bundled-sqlcipher-vendored-openssl", "hooks"] }
rand = "0.10.2"
zeroize = { version = "1.9.0", features = ["derive"] }
thiserror = "2.0.19"
parking_lot = "0.12.5"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
notify = "=8.2.0"
rust_xlsxwriter = "=0.97.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "native-tls", "stream"] }
futures-util = "=0.3.32"
tauri-plugin-wdio-webdriver = { version = "=1.2.0", optional = true }

[dev-dependencies]
tempfile = "3.27.0"
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem"] }
