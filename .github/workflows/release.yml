name: Signed Windows release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install complete Perl runtime for OpenSSL
        shell: pwsh
        run: |
          choco install strawberryperl --no-progress -y
          "C:\\Strawberry\\perl\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: npm ci
      - name: Build signed installer and portable package
        run: npm run release:windows
      - name: Generate Tauri update manifest
        run: npm run generate:update-manifest
      - name: Verify release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $required = @(
            "artifacts/release/latest.json",
            "artifacts/release/EveryFile_${version}_x64-setup.exe",
            "artifacts/release/EveryFile_${version}_x64-setup.exe.sig"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release asset: $path" }
          }
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.Substring(1)
          $assets = @(
            "artifacts/release/EveryFile-Setup-v$version.exe",
            "artifacts/release/EveryFile-Portable-v$version.zip",
            "artifacts/release/EveryFile_${version}_x64-setup.exe",
            "artifacts/release/EveryFile_${version}_x64-setup.exe.sig",
            "artifacts/release/latest.json",
            "artifacts/release/SHA256SUMS.txt"
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
          } else {
            gh release create $tag $assets --title "EveryFile $version" --generate-notes
          }
