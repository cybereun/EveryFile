name: Windows release gate

on:
  push:
    branches: [main, codex/phase-1-core-search]
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: Run only the Windows durable-reset diagnostic test
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        if: ${{ !inputs.diagnostics_only }}
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v6
        if: ${{ !inputs.diagnostics_only }}
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install complete Perl runtime for OpenSSL
        shell: pwsh
        run: |
          choco install strawberryperl --no-progress -y
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: npm ci
        if: ${{ !inputs.diagnostics_only }}
      - run: npm test -- --run
        if: ${{ !inputs.diagnostics_only }}
      - run: npm run build
        if: ${{ !inputs.diagnostics_only }}
      # Tauri validates externalBin resources during Cargo/Clippy. Build the
      # parser sidecar first on clean runners so the gate can inspect them.
      - run: node scripts/build-parser-sidecar.mjs
        if: ${{ !inputs.diagnostics_only }}
      - name: Build OCR sidecar
        if: ${{ !inputs.diagnostics_only }}
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-ocr-sidecar.ps1
      - run: cargo fmt --manifest-path src-tauri\Cargo.toml -- --check
        if: ${{ !inputs.diagnostics_only }}
      - run: cargo clippy --manifest-path src-tauri\Cargo.toml --all-targets -- -D warnings
        if: ${{ !inputs.diagnostics_only }}
      - run: npm run tauri build
        if: ${{ !inputs.diagnostics_only }}
      - run: powershell -ExecutionPolicy Bypass -File scripts/test-rust.ps1
        if: ${{ !inputs.diagnostics_only }}
      - run: powershell -ExecutionPolicy Bypass -File scripts/build-portable.ps1
        if: ${{ !inputs.diagnostics_only }}
      - run: powershell -ExecutionPolicy Bypass -File scripts/verify-no-console.ps1
        if: ${{ !inputs.diagnostics_only }}

      - name: Run durable reset test with diagnostics
        if: ${{ inputs.diagnostics_only }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri\\binaries | Out-Null
          foreach ($name in @('everyfile-parser-x86_64-pc-windows-msvc.exe', 'everyfile-ocr-x86_64-pc-windows-msvc.exe')) {
            [System.IO.File]::WriteAllBytes((Join-Path 'src-tauri\\binaries' $name), [byte[]](0))
          }
          cargo test --manifest-path src-tauri\Cargo.toml -j1 diagnostics::windows_reset_tests::durable_state_write_faults_never_publish_partial_json -- --nocapture --test-threads=1

      - shell: pwsh
        if: ${{ !inputs.diagnostics_only }}
        run: |
          Get-FileHash artifacts\release\* -Algorithm SHA256 |
            Select-Object Hash, Path |
            ConvertTo-Json |
            Set-Content artifacts\release\checksums.json

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.diagnostics_only }}
        with:
          name: EveryFile-Windows-v1.0.1
          path: artifacts/release/*
          if-no-files-found: error
